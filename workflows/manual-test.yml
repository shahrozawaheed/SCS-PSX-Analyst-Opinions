name: SCS Analyst Bot - Manual Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEND_EXISTING_ON_FIRST_RUN: "false"
        run: python scs_analyst_bot.py

      - name: Save duplicate database
        uses: actions/upload-artifact@v4
        with:
          name: scs-sent-posts
          path: sent_scs_analyst_posts.json
